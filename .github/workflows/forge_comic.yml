name: 🎨 MusiChris Comic Forge

on:
  repository_dispatch:
    types: [forge_comic]

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_TITLE: "${{ github.event.client_payload.title }} | @MusiChris Studio"
      VIDEO_DESCRIPTION: "📖 Una producción de @MusiChris Studio\n\nReflexión ministerial: ${{ github.event.client_payload.description }}\n\n#Shorts #Fe #Victoria #Ministerio"
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🧠 AI Story Expansion (Master Forge)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          const rawTitle = `${{ github.event.client_payload.title }}`;
          const rawIdea = `${{ github.event.client_payload.description }}`;
          const cleanIdea = rawIdea.replace(/BPM|tempo|Pads|Guitarra|eco|vibra|gritos|estilo|bpm/gi, "").replace(/\d+/g, " ").replace(/\s+/g, " ").trim();

          async function callCerebras(messages) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.cerebras.ai',
                path: '/v1/chat/completions',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.CEREBRAS_API_KEY
                }
              }, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) resolve(JSON.parse(data).choices[0].message.content);
                  else reject(new Error('Cerebras Error: ' + data));
                });
              });
              req.on('error', reject);
              req.write(JSON.stringify({ model: 'llama3.1-8b', messages }));
              req.end();
            });
          }

          async function produceWithSupervisor() {
            console.log('🎭 [CREADOR] Generando borrador...');
            let draft = await callCerebras([
              { 
                role: 'system', 
                content: 'Eres el Creador de @MusiChris. SCHEMA: {"creative_title": "...", "story": [{"prompt": "...", "text": "..."}, ...], "lesson": "...", "reference": "..."}. Story: lista de 8 objetos. REGLAS: 1. NARRATIVA PURA: Usa los 8 paneles para contar la historia bíblica/histórica de forma cronológica. 2. PROHIBIDO: No uses "ganchos" personales, reflexiones o preguntas al lector (ej: No digas "Recuerda cuando...", "Te has sentido..."). 3. PERSPECTIVA: Escribe en tercera persona como un narrador histórico. Cada panel debe ser un avance en la trama real.' 
              },
              { role: 'user', content: `Título: ${rawTitle}. Contexto: ${cleanIdea}.` }
            ]);

            console.log('🛡️ [SUPERVISOR] Realizando Auditoría Teológica y Artística...');
            let audit = await callCerebras([
              { 
                role: 'system', 
                content: 'Eres el Auditor Teológico de @MusiChris. Tu misión es asegurar la FIDELIDAD BÍBLICA LITERAL y NARRATIVA PURA. REGLAS: 1. El guion DEBE coincidir con el versículo y foco del "Contexto Sagrado". 2. RECHAZA interpretaciones modernas o simbólicas. 3. PROHIBIDO hablarle al lector o usar ganchos como "¿Recuerdas...?" o "Alguna vez...". Toda la historia debe ser narrada en tercera persona. 4. Asegura que los personajes y lugares sean correctos. Si hay fallos, responde EXACTAMENTE: "RECHAZADO: [Error específico] -> CORRECCIÓN: [Instrucción técnica]". Si está perfecto, responde "APROBADO".' 
              },
              { role: 'user', content: `Contexto Sagrado (Fuente de Verdad): ${cleanIdea}\n\nPropuesta de Guion a Auditar:\n${draft}` }
            ]);

            if (audit.includes('RECHAZADO')) {
              console.log(`⚠️ Feedback del Supervisor: ${audit}`);
              console.log('🔄 [CREADOR] Aplicando correcciones teológicas...');
              draft = await callCerebras([
                { 
                  role: 'system', 
                  content: 'Eres el Creador de @MusiChris. Debes corregir el guion siguiendo las instrucciones del Auditor. REGLAS CRÍTICAS: 1. Tu respuesta debe ser EXCLUSIVAMENTE el objeto JSON corregido. 2. PROHIBIDO usar ganchos personales o hablarle al lector ("¿Recuerdas...?", "Has visto..."). 3. Mantén narrativa pura en tercera persona sobre los hechos bíblicos. SCHEMA: {"creative_title": "...", "story": [{"prompt": "...", "text": "..."}, ...], "lesson": "...", "reference": "..."}.' 
                },
                { role: 'user', content: `Guion anterior: ${draft}\n\nFeedback del Auditor: ${audit}\n\nContexto Sagrado: ${cleanIdea}\n\nGenera el JSON corregido ahora.` }
              ]);
            } else {
              console.log('✨ Auditoría Superada: El mensaje es fiel y representativo.');
            }

            const jsonMatch = draft.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
              console.log('--- COMIENZO DE RESPUESTA FALLIDA ---');
              console.log(draft);
              console.log('--- FIN DE RESPUESTA FALLIDA ---');
              throw new Error('No se pudo generar un JSON válido tras la supervisión.');
            }
            fs.writeFileSync('story_expanded.json', jsonMatch[0]);
          }

          produceWithSupervisor().catch(err => {
            console.error('❌ ERROR CRÍTICO:', err.message);
            process.exit(1);
          });
          EOF


      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Python Dependencies
        run: pip install huggingface_hub Pillow requests python-dotenv

      - name: 🎥 Install FFmpeg + Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo "✅ Fuente instalada en:"
          fc-list | grep -i dejavu | grep Bold

      - name: 🎨 Forging Panels & Video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat > forge_runner.py << 'PYEOF'
          import os, sys, json, traceback
          sys.path.insert(0, os.getcwd())
          from scripts.comic_engine import MusiChrisComicEngine
          
          try:
              with open('story_expanded.json', 'r') as f:
                  story_data = json.load(f)
              
              print(f"✅ Story JSON cargado: {list(story_data.keys())}")
              
              title = story_data.get('creative_title', os.getenv('VIDEO_TITLE', 'MusiChris Story'))
              song_url = "${{ github.event.client_payload.song_url }}"
              
              # Normalizar clave lesson/teaching
              if 'lesson' in story_data and 'teaching' not in story_data:
                  story_data['teaching'] = story_data['lesson']

              # Normalizar Estructura de Historia (Soporte para lista 'story' o llaves 'panel1'...'panel8')
              if 'story' not in story_data or not isinstance(story_data['story'], list):
                  panels = []
                  for i in range(1, 10):
                      p_key = f"panel{i}"
                      if p_key in story_data:
                          panels.append(story_data[p_key])
                  
                  if not panels:
                      # Intentar buscar cualquier objeto que parezca un panel si las llaves fallan
                      panels = [v for k, v in story_data.items() if isinstance(v, dict) and ('prompt' in v or 'text' in v)]
                  
                  story_data['story'] = panels
              
              engine = MusiChrisComicEngine()
              
              if song_url and song_url.strip():
                  bg_audio = song_url
                  print(f"🎵 Usando canción: {song_url}")
              else:
                  bg_song = engine.get_random_bg_music()
                  bg_audio = bg_song['audio_url']
              
              print(f"🎨 Forjando {len(story_data['story'])} paneles...")
              p_paths = engine.forge_panels(story_data['story'])
              print(f"✅ Paneles forjados: {len(p_paths)}")
              
              if not p_paths:
                  print("❌ ERROR: No se generaron paneles.")
                  sys.exit(1)
              
              print("🎬 Renderizando video final...")
              result = engine.render_motion_comic(p_paths, title, bg_audio, "final_comic.mp4", story_data)
              print(f"🎉 ¡GLORIA A DIOS! Video creado en: {result}")
              
          except Exception as e:
              print(f"💥 ERROR CRÍTICO:")
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python3 forge_runner.py

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install Node Dependencies
        run: npm install googleapis

      - name: 🔍 Diagnostic & Upload
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "📂 ESCANEO TOTAL DE ARCHIVOS (ls -laR):"
          ls -laR
          
          VIDEO_FILE=$(find . -name "final_comic.mp4" | head -n 1)
          THUMB_FILE=$(find . -name "thumbnail.jpg" | head -n 1)
          
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ ERROR CRÍTICO: No se encontró el video final_comic.mp4 en ningún lugar."
            exit 1
          fi
          
          echo "📤 Subiendo video encontrado en: $VIDEO_FILE"
          echo "🖼️ Con miniatura encontrada en: $THUMB_FILE"
          node scripts/upload_engine.cjs "$VIDEO_FILE" "$THUMB_FILE"
