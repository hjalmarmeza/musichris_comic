<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiChris Comic | Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            padding: 20px 40px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--gold);
        }

        main {
            flex: 1;
            padding: 60px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            color: var(--gold);
            font-size: 42px;
            margin: 0;
        }

        .project-status {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            flex: 1;
            border-left: 4px solid var(--gold);
        }

        .status-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
        }

        .status-card p {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .actions {
            margin-top: 60px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .btn-action {
            padding: 20px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
        }

        .btn-action:hover {
            background: var(--gold);
            color: var(--bg);
        }
    </style>
</head>
<body>

    <nav>
        <a href="../Musichris_Hub/index.html" class="back-btn">
            ← VOLVER AL NEXUS
        </a>
        <div style="font-size: 14px; font-weight: 700; color: var(--gold);">COMIC OPERATIONAL</div>
    </nav>

    <main>
        <div class="header">
            <h1>MusiChris Comic</h1>
            <p style="color: #888;">Narrativas Visuales y Bandas Sonoras Animadas</p>
        </div>

        <div class="project-status">
            <div class="status-card">
                <h3>Último Episodio</h3>
                <p>La Promesa</p>
            </div>
            <div class="status-card">
                <h3>Escenas IA</h3>
                <p>Optimizadas</p>
            </div>
        </div>

        <div class="actions">
            <a href="https://docs.google.com/spreadsheets/d/1X_Wp_YFvN-U_Wn_S_p_U/edit" target="_blank" class="btn-action">GUIONES (SHEET)</a>
            <a href="https://github.com/hjalmarmeza/Musichris_Comic/actions" target="_blank" class="btn-action">GITHUB ACTIONS</a>
        </div>
    </main>

</body>
</html>
